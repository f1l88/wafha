services:
  # MongoDB услуга
  mongodb:
    image: mongo:6.0
    container_name: waf-demo-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example # Пожалуйста, замените пароль на ваш настоящий
      # Необязательно: Укажите исходное имя базы данных
      # MONGO_INITDB_DATABASE: waf_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb # Добавить объем конфигурационных данных
    ports:
      - "27017:27017"
    networks:
      - waf-network
    # Необязательно: Добавьте параметры командной строки
    # command: --wiredTigerCacheSizeGB 1.5

  # RuiQi WAF Сервис (унифицированное использование имен в нижнем регистре)
  ruiqi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruiqi-waf # Название контейнера в нижнем регистре
    restart: always
    depends_on:
      - mongodb
    environment:
      DB_URI: mongodb://root:example@mongodb:27017 # Пожалуйста, замените свой реальный пароль
      JWT_SECRET: ffffffffffffffffffffffffffffff
      IS_PRODUCTION: "false"
      VITE_API_BASE_URL: http://localhost:2333/api/v1
    ports:
      - "2333:2333"
      - "8080:8080"
      - "9443:9443"
      - "443:443"
      - "80:80"
      - "8404:8404"
    volumes:
      - ruiqi_data:/app/data
    networks:
      - waf-network

# Определение постоянного объема
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  ruiqi_data:
    driver: local

# Определите сеть
networks:
  waf-network:
    driver: bridge
